    '^https[:]//zfit\.rtfd\.io/$ https://zfit.readthedocs.io/en/stable/',
    "^(.+)/n$ $1",
]
retry_wait_time = 5
timeout = 30

[tool.pytest]
addopts = [
    "--color=yes",
    "--doctest-continue-on-failure",
    "--doctest-modules",
    "--durations=0",
    "--ignore-glob=*/.ipynb_checkpoints/*",
    "--ignore-glob=*/.virtual_documents/*",
    "--ignore=docs/011",
    "--ignore=docs/019/index.ipynb",
    "--ignore=docs/_static",
    "--ignore=docs/conf.py",
    "--nbmake",
    "--nbmake-timeout=7200",
]
filterwarnings = [
    "error",
    "ignore:Passing a schema to Validator.iter_errors is deprecated.*:DeprecationWarning",
    "ignore:open_text is deprecated.*:DeprecationWarning",
    "ignore:read_text is deprecated.*:DeprecationWarning",
    "ignore:unclosed .*:ResourceWarning",
]
norecursedirs = [
    ".ipynb_checkpoints",
    ".virtual_documents",
    "_build",
]
testpaths = ["docs"]

[tool.pytest_env]
EXECUTE_NB = "yes"

[tool.ruff]
extend-exclude = ["exported_intensity_model.py"]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ARG00",
    "DOC",
    "FBT",
    "PTH",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "private-member-access",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",
    "C90",
    "D",
    "PLR09",
    "T20",
    "TC00",
    "assert",
    "float-equality-comparison",
    "global-statement",
    "global-variable-not-assigned",
    "magic-value-comparison",
    "mixed-case-variable-in-global-scope",
    "non-lowercase-variable-in-function",
    "too-many-blank-lines",
    "useless-expression",
    "useless-semicolon",
]
"docs/*" = [
    "assert",
    "implicit-namespace-package",
    "request-without-timeout",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "import-private-name",
    "undocumented-public-module",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
include-package-data = false

[tool.setuptools_scm]
version_file = "version.py"

[tool.tombi.files]
exclude = [
    "**/Manifest.toml",
    "**/Project.toml",
    "**/uv.lock",
]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.3/compwa-policy.schema.json"
include = ["pyproject.toml"]

[[tool.ty.overrides]]
include = ["**/*.ipynb"]
rules.import-not-found = "ignore"
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.not-iterable = "ignore"
rules.not-subscriptable = "ignore"
rules.possibly-missing-attribute = "ignore"
rules.possibly-unresolved-reference = "ignore"
rules.unresolved-attribute = "ignore"
rules.unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["docs/_static/exported_intensity_model.py"]
rules.import-not-found = "ignore"
rules.unresolved-reference = "ignore"

[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.src]
exclude = ["docs/019/index.ipynb"]

[tool.ty.terminal]
error-on-warning = true
