[project]
name = "compwa-report"
description = "Source code for the ComPWA Organization pages"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Common Partial Wave Analysis", email = "compwa-admin@ep1.rub.de" }]
maintainers = [{ email = "compwa-admin@ep1.rub.de" }]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Documentation = "https://compwa.github.io/report"
Issues = "https://github.com/ComPWA/report/issues"
Source = "https://github.com/ComPWA/report"

[dependency-groups]
dev = [
    "ruff",
    "sphinx-autobuild",
    "ty",
    { include-group = "doc" },
    { include-group = "jupyter" },
    { include-group = "style" },
    { include-group = "test" },
]
doc = [
    "myst-nb",
    "nbformat",
    "sphinx",
    "sphinx-api-relink",
    "sphinx-book-theme",
    "sphinx-codeautolink[ipython]",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-hep-pdgref",
    "sphinx-pybtex-etal-style",
    "sphinx-thebe",
    "sphinx-togglebutton",
    "sphinxcontrib-bibtex>=2",
    { include-group = "notebooks" }
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
    { include-group = "notebooks" }
]
notebooks = ["pyproject-local-kernel"]
style = [
    "nbformat",
    "sphinx-api-relink",
]
test = [
    "nbmake",
    "pytest-env",
    { include-group = "notebooks" },
]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.compwa.policy]
package-manager = "pixi+uv"
repo-name = "report"
repo-title = "ComPWA Technical Reports"

[tool.compwa.policy.github]
dependabot-assignees = ["redeboer"]
github-pages = true
no-cd = true
no-pypi = true

[tool.compwa.policy.python]
docstrfmt = false
imports-on-top = true
type-checker = ["ty"]

[tool.isort]
profile = "black"

[tool.lychee]
cache = true
cache_exclude_status = "400.."
# [:] keeps Lychee from extracting regex patterns as URLs.
exclude = [
    '^https[:]//doi\.org/10\.7566/JPSCP\.26\.022002$',  # The publisher rejects automated requests from GitHub Actions
    '^https[:]//journals\.aps\.org/prd/abstract/10\.1103/PhysRevD\.101\.034033$',  # APS rejects automated requests from GitHub Actions
    '^https[:]//link\.aps\.org/doi/10\.1103/PhysRevD\.5\.624$',  # APS rejects automated requests from GitHub Actions
    '^https[:]//rosettacode\.org/wiki/Mandelbrot_set#Julia$',  # Rosetta Code rejects automated requests from GitHub Actions
    '^http[:]//doi\.wiley\.com/10\.1002/andp\.19955070504$',  # Rejects automated requests with 403
    '^https[:]//doi\.org/10\.1002/andp\.19955070504$',  # 403 for onlinelibrary.wiley.com
    '^https[:]//doi\.org/10\.1007/978-1-4612-9959-2$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//doi\.org/10\.1007/JHEP07\(2023\)228$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//downloads\.hindawi\.com/journals/ahep/2020/6674595\.pdf#page=\d+$',  # 403
    '^https[:]//github\.com/ComPWA/RUB-EP1-AG/issues/93$',  # private
    '^https[:]//iopscience\.iop\.org/article/10\.1088/1674-1137/abf139$',  # Redirects Lychee requests to a browser challenge
    '^https[:]//stackoverflow\.com/a/(?:42866568|5966088)$',  # Redirect target rejects automated requests with 403
    '^https[:]//www\.hindawi\.com/journals/ahep/2020/6674595/$',  # Rejects automated requests with 403
    "%7B[^/]*%7D",  # URL templates are completed at build or runtime
]
extensions = ["bib", "html", "ipynb", "json", "md", "py", "toml", "yaml", "yml"]
hidden = true  # Include the workflows under .github/
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "7d"
remap = [
    # Keep the original error messages in the frozen notebook and check the corresponding JAX release.
    '^https[:]//jax\.readthedocs\.io/en/latest/errors\.html#jax\.errors\.ConcretizationTypeError$ https://github.com/jax-ml/jax/blob/jax-v0.4.30/jax/_src/errors.py#L47',
    '^https[:]//jax\.readthedocs\.io/en/latest/errors\.html#jax\.errors\.TracerArrayConversionError$ https://github.com/jax-ml/jax/blob/jax-v0.4.30/jax/_src/errors.py#L230',
    '^git\+https[:]//github\.com/ComPWA/sympy(?:@.*)?$ https://github.com/sympy/sympy',
    '^git\+(https[:]//[^@]+)(@.*)?$ $1',
    '^https[:]//github\.com/ComPWA/compwa\.github\.io/pull/129#issuecomment-1096599896\\n$ https://github.com/ComPWA/compwa.github.io/pull/129',  # GitHub renders comment anchors dynamically
    '^https[:]//repo\.prefix\.dev/julia-forge$ https://prefix.dev/channels/julia-forge',  # The channel endpoint serves package metadata, not a web page
    '^https[:]//www\.geogebra\.org/material/iframe/id/dgjn83pb/stb/false/sdz/true/sri/true/$ https://www.geogebra.org/classic/dgjn83pb',  # The legacy iframe endpoint was retired; check the material in Classic
    '^https[:]//www\.geogebra\.org/material/iframe/id/tv5kr8pp/stb/false/sdz/true/sri/true/$ https://www.geogebra.org/classic/tv5kr8pp',  # The legacy iframe endpoint was retired; check the material in Classic
    "^(.+)/n$ $1",
]

[tool.pytest]
addopts = [
    "--color=yes",
    "--doctest-continue-on-failure",
    "--doctest-modules",
    "--durations=0",
    "--ignore-glob=*/.ipynb_checkpoints/*",
    "--ignore-glob=*/.virtual_documents/*",
    "--ignore=docs/011",
    "--ignore=docs/019/index.ipynb",
    "--ignore=docs/_static",
    "--ignore=docs/conf.py",
    "--nbmake",
    "--nbmake-timeout=7200",
]
filterwarnings = [
    "error",
    "ignore:Passing a schema to Validator.iter_errors is deprecated.*:DeprecationWarning",
    "ignore:open_text is deprecated.*:DeprecationWarning",
    "ignore:read_text is deprecated.*:DeprecationWarning",
    "ignore:unclosed .*:ResourceWarning",
]
norecursedirs = [
    ".ipynb_checkpoints",
    ".virtual_documents",
    "_build",
]
testpaths = ["docs"]

[tool.pytest_env]
EXECUTE_NB = "yes"

[tool.ruff]
extend-exclude = ["exported_intensity_model.py"]
extend-include = ["*.ipynb"]
preview = true
show-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
ignore = [
    "ARG00",
    "DOC",
    "FBT",
    "PTH",
    "any-type",
    "if-else-block-instead-of-if-exp",
    "incorrect-blank-line-before-class",
    "line-too-long",
    "logging-f-string",
    "missing-copyright-notice",
    "missing-dashed-underline-after-section",
    "missing-section-name-colon",
    "missing-trailing-comma",
    "multi-line-summary-second-line",
    "non-empty-init-module",
    "private-member-access",
    "pytest-fixture-incorrect-parentheses-style",
    "read-whole-file",
    "reimplemented-starmap",
    "single-line-implicit-string-concatenation",
    "undocumented-magic-method",
    "undocumented-public-class",
    "undocumented-public-function",
    "undocumented-public-init",
    "undocumented-public-method",
    "unspecified-encoding",
    "write-whole-file",
]
select = ["ALL"]
task-tags = ["cspell"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations".msg = "Notebooks should not use postponed evaluation of annotations."

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",
    "C90",
    "D",
    "PLR09",
    "T20",
    "TC00",
    "assert",
    "float-equality-comparison",
    "global-statement",
    "global-variable-not-assigned",
    "magic-value-comparison",
    "mixed-case-variable-in-global-scope",
    "non-lowercase-variable-in-function",
    "too-many-blank-lines",
    "useless-expression",
    "useless-semicolon",
]
"docs/*" = [
    "assert",
    "implicit-namespace-package",
    "request-without-timeout",
]
"docs/conf.py" = [
    "builtin-variable-shadowing",
    "import-private-name",
    "undocumented-public-module",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
include-package-data = false

[tool.setuptools_scm]
version_file = "version.py"

[tool.tombi.files]
exclude = [
    "**/Manifest.toml",
    "**/Project.toml",
    "**/uv.lock",
]

[tool.tombi.format.rules]
indent-width = 4
line-width = 88

[tool.tombi.lint.rules]
key-empty = "off"

[[tool.tombi.schemas]]
root = "tool.compwa.policy"
path = "https://raw.githubusercontent.com/ComPWA/policy/0.10.5/compwa-policy.schema.json"
include = ["pyproject.toml"]

[[tool.ty.overrides]]
include = ["**/*.ipynb"]
rules.import-not-found = "ignore"
rules.invalid-argument-type = "ignore"
rules.invalid-assignment = "ignore"
rules.missing-attribute = "ignore"
rules.not-iterable = "ignore"
rules.not-subscriptable = "ignore"
rules.possibly-missing-attribute = "ignore"
rules.possibly-unresolved-reference = "ignore"
rules.unresolved-reference = "ignore"

[[tool.ty.overrides]]
include = ["docs/_static/exported_intensity_model.py"]
rules.import-not-found = "ignore"
rules.unresolved-reference = "ignore"

[tool.ty.rules]
division-by-zero = "warn"
possibly-missing-import = "warn"
possibly-unresolved-reference = "warn"

[tool.ty.src]
exclude = ["docs/019/index.ipynb"]

[tool.ty.terminal]
error-on-warning = true
