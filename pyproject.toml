[project]
name = "compwa-report"
description = "Source code for the ComPWA Organization pages"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Common Partial Wave Analysis", email = "compwa-admin@ep1.rub.de" }]
maintainers = [{ email = "compwa-admin@ep1.rub.de" }]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Documentation = "https://compwa.github.io/report"
Issues = "https://github.com/ComPWA/report/issues"
Source = "https://github.com/ComPWA/report"

[dependency-groups]
dev = [
    "ruff",
    "sphinx-autobuild",
    { include-group = "doc" },
    { include-group = "jupyter" },
    { include-group = "style" },
    { include-group = "test" }
]
doc = [
    "myst-nb",
    "nbformat",
    "sphinx",
    "sphinx-api-relink",
    "sphinx-book-theme",
    "sphinx-codeautolink[ipython]",
    "sphinx-comments",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-hep-pdgref",
    "sphinx-pybtex-etal-style",
    "sphinx-thebe",
    "sphinx-togglebutton",
    "sphinxcontrib-bibtex >=2",
    { include-group = "notebooks" }
]
jupyter = [
    "jupyter-ruff",
    "jupyterlab",
    "jupyterlab-git",
    "jupyterlab-lsp",
    "jupyterlab-myst",
    "jupyterlab-quickopen",
    "python-lsp-ruff",
    "python-lsp-server",
    { include-group = "notebooks" }
]
notebooks = ["pyproject-local-kernel"]
style = [
    "nbformat",
    "sphinx-api-relink",
    "ty",
]
test = [
    "nbmake",
    "pytest-env",
    { include-group = "notebooks" },
]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[tool.compwa.policy]
package-manager = "pixi+uv"
repo-name = "report"
repo-title = "ComPWA Technical Reports"

[tool.compwa.policy.github]
github-pages = true
no-cd = true
no-pypi = true

[tool.compwa.policy.python]
imports-on-top = true
type-checker = ["ty"]

[tool.isort]
profile = "black"

[tool.lychee]
cache = true
exclude = [
    # `[:]` stops lychee from extracting these patterns as links from this file
    '^http[:]//doi\.wiley\.com/10\.1002/andp\.19955070504$',  # Rejects automated requests with 403
    '^http[:]//www\.curtismeyer\.com/talks/PWA_Munich_KMatrix\.pdf$',  # The lecture website does not respond to automated requests
    '^https[:]//doi\.org/10\.1002/andp\.19955070504$',  # 403 for onlinelibrary.wiley.com
    '^https[:]//doi\.org/10\.1007/978-1-4612-9959-2$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//doi\.org/10\.1007/JHEP07\(2023\)228$',  # Publisher redirects automated requests through a cookie challenge
    '^https[:]//doi\.org/10\.7566/JPSCP\.26\.022002$',  # 403 for journals.jps.jp
    '^https[:]//downloads\.hindawi\.com/journals/ahep/2020/6674595\.pdf#page=\d+$',  # 403
    '^https[:]//github\.com/(?:user-attachments/assets|[^/]+/[^/]+/assets)/',  # Asset links redirect to expiring signed downloads
    '^https[:]//github\.com/ComPWA/RUB-EP1-AG/issues/93$',  # private
    '^https[:]//iopscience\.iop\.org/article/10\.1088/1674-1137/abf139$',  # Redirects Lychee requests to a browser challenge
    '^https[:]//journals\.aps\.org/prd/abstract/10\.1103/PhysRevD\.101\.034033$',  # Rejects automated requests with 403
    '^https[:]//link\.aps\.org/doi/10\.1103/PhysRevD\.5\.624$',  # Rejects automated requests with 403
    '^https[:]//rosettacode\.org/wiki/Mandelbrot_set#Julia$',  # Intermittently rejects GitHub Actions requests with 403
    '^https[:]//stackoverflow\.com/a/(?:42866568|5966088)$',  # Redirect target rejects automated requests with 403
    '^https[:]//www\.hindawi\.com/journals/ahep/2020/6674595/$',  # Rejects automated requests with 403
    "%7B[^/]*%7D",  # URL templates are completed at build or runtime
]
extensions = ["bib", "html", "ipynb", "json", "md", "py", "toml", "yaml", "yml"]
hidden = true  # Include the workflows under .github/
include_fragments = "anchor-only"
include_verbatim = true
max_cache_age = "2d"
max_redirects = 0
max_retries = 3
