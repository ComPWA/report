[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = ["sympy"]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "COM812",
    "CPY001",
    "D",
    "ISC001",
]
