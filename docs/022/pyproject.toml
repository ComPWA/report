[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "jax",
    "matplotlib",
    "polarimetry-lc2pkpi==0.0.11",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN001",
    "ANN201",
    "C408",
    "COM812",
    "CPY001",
    "D",
    "F404",
    "F821",
    "ISC001",
    "PLC2401",
    "PLC2701",
    "PLR0913",
    "PLR0917",
    "PLR2004",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.uv.workspace]
