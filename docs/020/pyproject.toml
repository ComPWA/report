[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.10.0"
dependencies = [
    "ampform[viz]~=0.14.1",
    "hepstats",
    "matplotlib",
    "numpy~=1.0",
    "pandas",
    "particle<1",
    "qrules==0.10.3",
    "tensorwaves[jax,pwa]~=0.4.8",
    "zfit~=0.14.0",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "missing-type-function-argument",
    "ANN20",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "line-too-long",
    "single-line-implicit-string-concatenation",
]
select = ["ALL"]

[tool.uv.workspace]
