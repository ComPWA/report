[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ampform",
    "ipympl",
    "ipywidgets",
    "matplotlib",
    "tensorwaves",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN00",
    "ANN20",
    "ARG002",
    "COM812",
    "CPY001",
    "D",
    "F404",
    "FBT00",
    "ISC001",
    "N806",
    "PLC2401",
    "PLR0913",
    "PLR0917",
    "PLW0603",
    "PYI034",
    "S404",
    "S603",
]
select = ["ALL"]

[tool.ruff.lint.flake8-self]
ignore-names = ["_print"]

[tool.uv.workspace]
