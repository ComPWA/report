[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ipympl",
    "ipywidgets",
    "matplotlib",
    "nbformat>=4.2.0",
    "plotly~=5.0",
    "sympy",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN001",
    "ANN201",
    "ARG001",
    "C408",
    "COM812",
    "CPY001",
    "D",
    "ISC001",
    "N806",
    "S404",
    "S603",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.uv.workspace]
