[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.10.0"
dependencies = [
    "ampform[viz]~=0.9.0",
    "jax==0.4.18",
    "jaxlib==0.4.18",
    "matplotlib",
    "numpy~=1.0",
    "pandas~=1.0",
    "particle<1",
    "setuptools<82",
    "sympy~=1.8.0",
    "tensorwaves~=0.2.0",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "missing-type-args",
    "ANN20",
    "unused-function-argument",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "docstring-missing-returns",
    "line-too-long",
    "late-future-import",
    "future-rewritable-type-annotation",
    "logging-f-string",
    "single-line-implicit-string-concatenation",
    "root-logger-call",
    "magic-value-comparison",
    "assert",
    "print",
    "typing-only-standard-library-import",
]
select = ["ALL"]

[tool.uv.workspace]
