[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.10.0"
dependencies = [
    "ampform[viz]~=0.9.0",
    "jax==0.4.18",
    "jaxlib==0.4.18",
    "matplotlib",
    "numpy~=1.0",
    "pandas~=1.0",
    "particle<1",
    "setuptools<82",
    "sympy~=1.8.0",
    "tensorwaves~=0.2.0",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN002",
    "ANN20",
    "ARG001",
    "COM812",
    "CPY001",
    "D",
    "DOC201",
    "E501",
    "F404",
    "FA100",
    "G004",
    "ISC001",
    "LOG015",
    "PLR2004",
    "S101",
    "T201",
    "TC003",
]
select = ["ALL"]

[tool.uv.workspace]
