[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ampform~=0.13.3",
    "matplotlib",
    "qrules[viz]~=0.9.7",
    "tensorwaves[jax,pwa]~=0.4.8",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN001",
    "COM812",
    "CPY001",
    "D",
    "E501",
    "ISC001",
    "PLR2004",
    "PLW2901",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.uv.workspace]
