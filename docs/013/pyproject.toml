[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ampform~=0.13.3",
    "matplotlib",
    "qrules[viz]~=0.9.7",
    "tensorwaves[jax,pwa]~=0.4.8",
]

[tool.pyproject-local-kernel]
# Override UV_PYTHON, because TensorFlow provides no wheels for Python 3.14 yet
python-cmd = ["uv", "run", "--python=3.13", "--with=ipykernel", "python"]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "missing-type-function-argument",
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "line-too-long",
    "single-line-implicit-string-concatenation",
    "magic-value-comparison",
    "redefined-loop-name",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.uv.workspace]
