[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ampform~=0.12.6",
    "tensorwaves[jax,pwa]~=0.4.8",
]

[tool.pyproject-local-kernel]
# Override UV_PYTHON, because TensorFlow provides no wheels for Python 3.14 yet
python-cmd = ["uv", "run", "--python=3.13", "--with=ipykernel", "python"]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "single-line-implicit-string-concatenation",
    "assert",
]
select = ["ALL"]

[tool.uv.workspace]
