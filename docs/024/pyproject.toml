[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ampform",
    "graphviz",
    "polarimetry-lc2pkpi==0.0.11",
    "sympy",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "missing-trailing-comma",
    "missing-copyright-notice",
    "D",
    "line-too-long",
    "lambda-assignment",
    "ambiguous-variable-name",
    "undefined-name",
    "write-whole-file",
    "single-line-implicit-string-concatenation",
    "non-ascii-name",
    "unspecified-encoding",
    "builtin-open",
    "assert",
    "exec-builtin",
    "suspicious-eval-usage",
]
select = ["ALL"]

[tool.ruff.lint.flake8-self]
ignore-names = ["_print"]

[tool.uv.workspace]
