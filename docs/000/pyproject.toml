[project]
dependencies = [
    "black",
    "jax",
    "numpy~=1.23.0",
    "sympy",
]
name = "technical-report"
requires-python = "~=3.11.0"
version = "0.1.0"

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN001",
    "ANN201",
    "COM812",
    "CPY001",
    "D",
    "ISC001",
    "T201",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["display"]

[tool.uv.workspace]
