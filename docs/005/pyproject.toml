[project]
name = "technical-report"
version = "0.1.0"
requires-python = "~=3.13.0"
dependencies = [
    "ampform[viz]~=0.15.0",
    "ipympl",
    "ipywidgets",
    "mpl-interactions",
]

[tool.ruff]
preview = true

[tool.ruff.lint]
ignore = [
    "ANN00",
    "ANN202",
    "ARG001",
    "C901",
    "COM812",
    "CPY001",
    "D",
    "F404",
    "F821",
    "ISC001",
    "N80",
    "N816",
    "PLR091",
    "PLR2004",
    "S404",
    "S603",
    "SLF001",
]
select = ["ALL"]

[tool.ruff.lint.flake8-builtins]
ignorelist = ["display"]

[tool.uv.workspace]
