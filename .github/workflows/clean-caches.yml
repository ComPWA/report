name: Clean caches

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:
    inputs:
      ref:
        description: Clean caches for this branch name or ref
        required: false
        type: string

jobs:
  cleanup:
    name: Remove caches
    runs-on: ubuntu-slim
    steps:
      - uses: ComPWA/actions/clean-caches@f9873a74ec6f40f8b3d17327f3f0f8e517a5becd # v4.1.6
        with:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.ref }}
