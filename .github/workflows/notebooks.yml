name: Run notebooks

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  workflow_dispatch:
    inputs:
      notebook-selector:
        description: Space-separated paths to notebooks (runs all if omitted)
        required: false
        type: string
  pull_request:

jobs:
  pytest:
    name: Test notebooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install graphviz
        run: sudo apt-get -y install graphviz
      - name: Collect notebooks to test
        id: notebooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            direct=$(echo "$changed" | grep '\.ipynb$' || true)
            from_locks=$(echo "$changed" | grep 'uv\.lock$' | while read lock; do
              find "$(dirname "$lock")" -name '*.ipynb'
            done || true)
            ignored=$(grep '"--ignore=' pyproject.toml | sed 's/.*"--ignore=\([^"]*\)".*/\1/')
            selector=$(printf '%s\n%s' "$direct" "$from_locks" \
              | sort -u | grep -v '^$' \
              | while IFS= read -r nb; do
                  while IFS= read -r ig; do
                    case "$nb" in "$ig"|"$ig/"*) continue 2;; esac
                  done <<< "$ignored"
                  echo "$nb"
                done \
              | tr '\n' ' ' | xargs)
          else
            selector="${{ github.event.inputs.notebook-selector }}"
          fi
          echo "selector=$selector" >> $GITHUB_OUTPUT
      - name: Run notebooks
        if: github.event_name != 'pull_request' || steps.notebooks.outputs.selector != ''
        run: uv run --group test --no-dev pytest ${{ steps.notebooks.outputs.selector }}
