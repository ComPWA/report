name: Run all notebooks

on:
  workflow_dispatch:
    inputs:
      notebook-selector:
        description: Relative path to notebooks
        required: false
        type: string
  pull_request:

jobs:
  pytest:
    name: Test all notebooks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - name: Install graphviz
        run: sudo apt-get -y install graphviz
      - name: Determine notebooks to test
        id: notebooks
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            selector=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep '\.ipynb$' || true)
            selector=$(echo "$selector" | tr '\n' ' ' | xargs)
          else
            selector="${{ github.event.inputs.notebook-selector }}"
          fi
          echo "selector=$selector" | tee -a $GITHUB_OUTPUT
      - name: Run notebooks
        if: github.event_name != 'pull_request' || steps.notebooks.outputs.selector != ''
        run: uv run --group test --no-dev pytest ${{ steps.notebooks.outputs.selector }}
